<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Time-Shift Runner</title>
  <style>
    body {
      margin: 0;
      background: black;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    canvas {
      border: 3px solid white;
      border-radius: 12px;
      box-shadow: 0 0 25px rgba(255, 255, 255, 0.3);
    }

    #overlay,
    #countdownOverlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.7);
      display: none;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      color: white;
      font-size: 22px;
      z-index: 10;
    }

    #countdownOverlay h1 {
      font-size: 80px;
      animation: pop 0.8s ease;
    }

    @keyframes pop {
      0% {
        transform: scale(0.5);
        opacity: 0;
      }
      50% {
        transform: scale(1.2);
        opacity: 1;
      }
      100% {
        transform: scale(1);
      }
    }

    button {
      margin-top: 15px;
      padding: 10px 20px;
      font-size: 18px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
  </style>
</head>

<body>
  <canvas id="gameCanvas" width="800" height="400"></canvas>

  <div id="overlay">
    <h1>Game Over</h1>
    <p id="finalScore"></p>
    <p id="highScoreText"></p>
    <h3>Leaderboard</h3>
    <ol id="leaderboard"></ol>
    <button onclick="restartGame()">Restart</button>
  </div>

  <div id="countdownOverlay">
    <h1 id="countdownText"></h1>
  </div>

  <!-- Audio files -->
  <audio id="bgMusic" src="https://files.catbox.moe/7t3k8v.mp3" loop></audio>
  <audio id="jumpSound" src="https://actions.google.com/sounds/v1/cartoon/wood_plank_flicks.ogg"></audio>
  <audio id="pointSound" src="https://actions.google.com/sounds/v1/cartoon/pop.ogg"></audio>
  <audio id="gameOverSound" src="https://actions.google.com/sounds/v1/cartoon/clang_and_wobble.ogg"></audio>
  <audio id="restartSound" src="https://actions.google.com/sounds/v1/cartoon/wood_plank_flicks.ogg"></audio>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    const overlay = document.getElementById("overlay");
    const countdownOverlay = document.getElementById("countdownOverlay");
    const countdownText = document.getElementById("countdownText");
    const finalScoreText = document.getElementById("finalScore");
    const highScoreText = document.getElementById("highScoreText");
    const leaderboardList = document.getElementById("leaderboard");

    const bgMusic = document.getElementById("bgMusic");
    const jumpSound = document.getElementById("jumpSound");
    const pointSound = document.getElementById("pointSound");
    const gameOverSound = document.getElementById("gameOverSound");
    const restartSound = document.getElementById("restartSound");

    let player;
    let gravity = 0.6;
    let obstacles = [];
    let speed = 5;
    let score = 0;
    let highScore = localStorage.getItem("highScore") || 0;
    let leaderboard = JSON.parse(localStorage.getItem("leaderboard")) || [];
    let frame = 0;
    let gameRunning = false;
    let paused = false;

    function resetPlayer() {
      player = {
        x: 80,
        y: 300,
        w: 40,
        h: 40,
        dy: 0,
        grounded: true
      };
    }

    document.addEventListener("keydown", (e) => {
      if (e.code === "Space") {
        if (!gameRunning && overlay.style.display === "flex") {
          restartGame();
        } else {
          jump();
        }
      }
      if (e.code === "KeyP") {
        paused = !paused;
      }
    });

    canvas.addEventListener("touchstart", jump);

    function jump() {
      if (player.grounded) {
        player.dy = -12;
        player.grounded = false;
        jumpSound.currentTime = 0;
        jumpSound.play();
      }
    }

    function drawBackground() {
      const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
      gradient.addColorStop(0, "#87CEEB");
      gradient.addColorStop(1, "#ffffff");
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, canvas.width, canvas.height);
    }

    function drawGround() {
      ctx.fillStyle = "#228B22";
      ctx.fillRect(0, 360, canvas.width, 10);
      ctx.fillStyle = "#654321";
      ctx.fillRect(0, 370, canvas.width, 30);
    }

    function drawPlayer() {
      ctx.fillStyle = "#FF4500";
      ctx.beginPath();
      ctx.arc(player.x + player.w / 2, player.y + player.h / 2, player.w / 2, 0, Math.PI * 2);
      ctx.fill();
    }

    function drawObstacles() {
      ctx.fillStyle = "#006400";
      obstacles.forEach((o) => {
        ctx.beginPath();
        ctx.moveTo(o.x, o.y + o.h);
        ctx.lineTo(o.x + o.w / 2, o.y);
        ctx.lineTo(o.x + o.w, o.y + o.h);
        ctx.closePath();
        ctx.fill();
      });
    }

    function updatePlayer() {
      player.y += player.dy;
      if (player.y + player.h < 360) {
        player.dy += gravity;
        player.grounded = false;
      } else {
        player.y = 360 - player.h;
        player.dy = 0;
        player.grounded = true;
      }
    }

    function updateObstacles() {
      if (!paused) {
        obstacles.forEach((o) => (o.x -= speed));
        if (frame % Math.max(60 - Math.floor(score / 20), 20) === 0) {
          const h = 30 + Math.random() * 40;
          obstacles.push({
            x: canvas.width,
            y: 360 - h,
            w: 30,
            h: h
          });
        }
        obstacles = obstacles.filter((o) => o.x + o.w > 0);
      }
    }

    function checkCollision() {
      for (let o of obstacles) {
        if (
          player.x < o.x + o.w &&
          player.x + player.w > o.x &&
          player.y < o.y + o.h &&
          player.y + player.h > o.y
        ) {
          gameOver();
          return;
        }
      }
    }

    function drawScore() {
      ctx.fillStyle = "white";
      ctx.font = "20px Arial";
      ctx.fillText("Score: " + score, 20, 30);
      ctx.fillText("High Score: " + highScore, 20, 60);
      if (paused) {
        ctx.fillStyle = "yellow";
        ctx.font = "40px Arial";
        ctx.fillText("Paused", canvas.width / 2 - 60, canvas.height / 2);
      }
    }

    function gameOver() {
      gameOverSound.currentTime = 0;
      gameOverSound.play();
      bgMusic.pause();
      gameRunning = false;

      if (score > highScore) {
        highScore = score;
        localStorage.setItem("highScore", highScore);
      }

      leaderboard.push(score);
      leaderboard.sort((a, b) => b - a);
      leaderboard = leaderboard.slice(0, 5);
      localStorage.setItem("leaderboard", JSON.stringify(leaderboard));

      finalScoreText.innerText = "Final Score: " + score;
      highScoreText.innerText = "High Score: " + highScore;
      leaderboardList.innerHTML = leaderboard
        .map((s, i) => `<li>Player ${i + 1}: ${s}</li>`)
        .join("");
      overlay.style.display = "flex";
    }

    function restartGame() {
      restartSound.currentTime = 0;
      restartSound.play();
      score = 0;
      speed = 5;
      frame = 0;
      obstacles = [];
      resetPlayer();
      overlay.style.display = "none";
      startCountdown();
    }

    function gameLoop() {
      if (!gameRunning) return;
      if (paused) {
        requestAnimationFrame(gameLoop);
        return;
      }

      ctx.clearRect(0, 0, canvas.width, canvas.height);
      drawBackground();
      drawGround();
      drawPlayer();
      drawObstacles();
      updatePlayer();
      updateObstacles();
      checkCollision();

      if (frame % 10 === 0) {
        score++;
        if (score % 5 === 0) {
          pointSound.currentTime = 0;
          pointSound.play();
        }
        if (score % 100 === 0) speed += 0.5;
      }

      drawScore();
      frame++;
      requestAnimationFrame(gameLoop);
    }

    function startCountdown() {
      let count = 3;
      countdownOverlay.style.display = "flex";
      countdownText.innerText = count;

      let interval = setInterval(() => {
        count--;
        if (count > 0) {
          countdownText.innerText = count;
        } else {
          countdownText.innerText = "Go!";
          clearInterval(interval);
          setTimeout(() => {
            countdownOverlay.style.display = "none";
            gameRunning = true;
            bgMusic.currentTime = 0;
            bgMusic.play();
            gameLoop();
          }, 800);
        }
      }, 1000);
    }

    // Initialize game
    resetPlayer();
    startCountdown();
  </script>
</body>
</html>
